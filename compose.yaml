services:
  postgres:
    image: postgres:18.1
    environment:
      POSTGRES_DB: learning_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d learning_service"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - learning-service-postgres-data:/var/lib/postgresql

volumes:
  learning-service-postgres-data:
