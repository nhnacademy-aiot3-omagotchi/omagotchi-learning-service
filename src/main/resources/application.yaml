server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: learning-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/learning_service}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  flyway:
    locations: classpath:db/migration
    default-schema: learning_service
    schemas:
      - learning_service
    create-schemas: true
    clean-disabled: true
    validate-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: learning_service
        jdbc:
          time_zone: UTC

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      show-details: never

timer:
  max-duration: ${TIMER_MAX_DURATION:PT12H}

telegram:
  bot:
    username: ${TELEGRAM_BOT_USERNAME:omagotchi_bot}
    token: ${TELEGRAM_BOT_TOKEN:}
  link-token:
    ttl: ${TELEGRAM_LINK_TOKEN_TTL:PT10M}

community:
  attachments:
    storage-root: ${COMMUNITY_ATTACHMENT_STORAGE_ROOT:data/community-attachments}
    max-file-size: ${COMMUNITY_ATTACHMENT_MAX_FILE_SIZE:5MB}
    max-count: ${COMMUNITY_ATTACHMENT_MAX_COUNT:5}
    allowed-extensions:
      - jpg
      - jpeg
      - png
      - gif
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/gif

auth:
  jwt:
    issuer: ${JWT_ISSUER:https://identity.omagotchi.local}
    audience: ${JWT_AUDIENCE:omagotchi-api}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:file:./secrets/jwt-public.pem}
