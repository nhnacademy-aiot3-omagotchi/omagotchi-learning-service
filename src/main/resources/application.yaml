server:
  port: ${SERVER_PORT}

spring:
  application:
    name: learning-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

  flyway:
    locations: classpath:db/migration
    default-schema: learning_service
    schemas:
      - learning_service
    create-schemas: true
    clean-disabled: true
    validate-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: learning_service
        jdbc:
          time_zone: UTC
  rabbitmq:
    listener:
      simple:
        missing-queues-fatal: false
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 1000ms
          multiplier: 2
          max-interval: 10000ms
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated

eureka:
  client:
    enabled: ${EUREKA_ENABLED}
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
    serviceUrl:
      defaultZone: ${EUREKA_URL}

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      show-details: never

timer:
  max-duration: ${TIMER_MAX_DURATION}

telegram:
  bot:
    username: ${TELEGRAM_BOT_USERNAME}
  link-token:
    ttl: ${TELEGRAM_LINK_TOKEN_TTL}

community:
  attachments:
    storage-root: ${COMMUNITY_ATTACHMENT_STORAGE_ROOT}
    max-file-size: ${COMMUNITY_ATTACHMENT_MAX_FILE_SIZE}
    max-count: ${COMMUNITY_ATTACHMENT_MAX_COUNT}
    allowed-extensions:
      - jpg
      - jpeg
      - png
      - gif
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/gif

realtime:
  presence:
    session-ttl: ${REALTIME_PRESENCE_SESSION_TTL}

auth:
  jwt:
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION}
