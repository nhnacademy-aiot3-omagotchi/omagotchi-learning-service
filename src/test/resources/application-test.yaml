server:
  port: 0

spring:
  rabbitmq:
    listener:
      simple:
        auto-startup: false
  http:
    clients:
      connect-timeout: 1s
      read-timeout: 2s
    serviceclient:
      identity-service:
        base-url: http://localhost:8083
  flyway:
    # 기준 데이터(캐릭터·퀘스트·레벨)는 운영에서 GamificationReferenceDataBootstrap이 적재한다.
    # @DataJpaTest 같은 슬라이스는 @Component를 스캔하지 않아 ApplicationRunner가 실행되지 않으므로
    # 테스트에서는 db/seed 의 R__test_reference_data.sql 로 같은 데이터를 채운다.
    # db/seed 는 src/test/resources 에만 있으므로 운영 classpath 에는 포함되지 않는다.
    locations: classpath:db/migration,classpath:db/seed
  datasource:
    # 통합 테스트에서는 @ServiceConnection이 이 값을 Testcontainers PostgreSQL로 덮어씀
    url: jdbc:postgresql://localhost:5432/unused_learning_test
    username: test
    password: test
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      username: ""
      password: ""
      connect-timeout: 1s
      timeout: 1s
      ssl:
        enabled: false

eureka:
  client:
    # 테스트에서 실행 중인 Discovery Service에 연결하지 않음
    enabled: false
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

timer:
  max-duration: PT12H

prediction:
  client:
    # Application Context 기동만 검증하는 테스트가 실제 prediction-service에 연결하지 않도록 한다.
    base-url: http://localhost:8085

telegram:
  bot:
    username: omagotchi_test_bot
  link-token:
    ttl: PT10M

community:
  attachments:
    storage-root: target/test-community-attachments
    max-file-size: 5MB
    max-count: 5

realtime:
  presence:
    session-ttl: 60s

auth:
  jwt:
    issuer: https://identity.omagotchi.local
    audience: omagotchi-api
    # TestJwtKeyConfig가 메모리에서 생성한 공개키 Bean을 제공
    public-key-location: classpath:unused-test-key.pem
  rule:
    username: rule-service
    password: test-only-rule-learning-password

clients:
  identity:
    username: learning-service
    password: test-only-learning-identity-password

sensor:
  influx:
    # 테스트에서는 실제 접속을 하지 않는다. 클라이언트 Bean 생성만 통과시키는 값
    url: http://localhost:8086
    token: test-token
    org: test-org
    buckets:
      raw: omagotchi-raw
      avg-1h: omagotchi-avg-1h
      avg-1d: omagotchi-avg-1d

omagotchi:
  scheduling:
    # 배경에서 도는 만료 정리가 테스트가 만든 점유를 EXPIRED로 바꿔 버리면
    # 실패 원인이 테스트 코드와 무관한 곳에 생긴다. 정리 동작 자체는
    # OccupancyExpiryIT가 서비스를 직접 호출해 검증한다
    enabled: false
