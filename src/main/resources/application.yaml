server:
  port: ${SERVER_PORT}

spring:
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: gemini-2.5-flash # 변경 가능
          temperature: 0.7
    ollama:
      base-url: ${OLLAMA_BASE_URL}
      chat:
        model: qwen2.5:latest # 변경 가능
        temperature: 0.3
        top-p: 0.9
        top-k: 40
  application:
    name: learning-service

  cloud:
    loadbalancer:
      cache:
        enabled: false

  http:
    clients:
      connect-timeout: ${IDENTITY_SERVICE_CONNECT_TIMEOUT}
      read-timeout: ${IDENTITY_SERVICE_READ_TIMEOUT}
    serviceclient:
      identity-service:
        base-url: ${IDENTITY_SERVICE_BASE_URL}

  task:
    execution:
      # AsyncConfig의 eventTaskExecutor와 Boot 기본 실행기를 분리한다 (ADR space-team/0012).
      # 지우면 applicationTaskExecutor가 사라져 이름 없는 @Async가 이벤트 실행기로 가는데,
      # 기동도 로그도 정상이라 드러나지 않는다. AsyncConfigTest가 이 값을 고정한다.
      mode: force

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      database: ${REDIS_DATABASE}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

  flyway:
    locations: classpath:db/migration
    default-schema: learning_service
    schemas:
      - learning_service
    create-schemas: true
    clean-disabled: true
    validate-on-migrate: true
    postgresql:
      transactional-lock: false

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: learning_service
        jdbc:
          time_zone: UTC
  rabbitmq:
    listener:
      simple:
        missing-queues-fatal: false
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 1000ms
          multiplier: 2
          max-interval: 10000ms
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated

eureka:
  client:
    jersey:
      enabled: false
    enabled: ${EUREKA_ENABLED}
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
    serviceUrl:
      defaultZone: ${EUREKA_URL}

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      show-details: never

timer:
  max-duration: ${TIMER_MAX_DURATION}

prediction:
  client:
    base-url: ${PREDICTION_SERVICE_BASE_URL}
    connect-timeout: ${PREDICTION_SERVICE_CONNECT_TIMEOUT:2s}
    read-timeout: ${PREDICTION_SERVICE_READ_TIMEOUT:5s}

telegram:
  bot:
    username: ${TELEGRAM_BOT_USERNAME}
    token: ${TELEGRAM_BOT_TOKEN:}
    max-threads: ${TELEGRAM_BOT_MAX_THREADS:4}
    timeout:
      connection-request: ${TELEGRAM_CONNECTION_REQUEST_TIMEOUT:PT5S}
      connect: ${TELEGRAM_CONNECT_TIMEOUT:PT5S}
      read: ${TELEGRAM_READ_TIMEOUT:PT10S}
  link-token:
    ttl: ${TELEGRAM_LINK_TOKEN_TTL}
  notification:
    enabled: ${TELEGRAM_NOTIFICATION_ENABLED:false}

community:
  attachments:
    storage-root: ${COMMUNITY_ATTACHMENT_STORAGE_ROOT}
    max-file-size: ${COMMUNITY_ATTACHMENT_MAX_FILE_SIZE}
    max-count: ${COMMUNITY_ATTACHMENT_MAX_COUNT}
    allowed-extensions:
      - jpg
      - jpeg
      - png
      - gif
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/gif

realtime:
  presence:
    session-ttl: ${REALTIME_PRESENCE_SESSION_TTL}

environment:
  cache:
    capacity: 1000
    retention: P7D
  cooldown: PT5M
  iot:
    request-timeout: PT3S
    secret: ${IOT_SECRET:}
    base-url: ${IOT_BASE_URL:}
    simulator:
      enabled: ${IOT_SIMULATOR_ENABLED:false}

auth:
  jwt:
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION}
  rule:
    username: ${RULE_LEARNING_USERNAME}
    password: ${RULE_LEARNING_PASSWORD}

clients:
  identity:
    username: ${LEARNING_IDENTITY_USERNAME}
    password: ${LEARNING_IDENTITY_PASSWORD}

sensor:
  series:
    zone: ${SENSOR_SERIES_ZONE:Asia/Seoul}
  influx:
    url: ${INFLUXDB_URL}
    token: ${INFLUXDB_TOKEN}
    org: ${INFLUXDB_ORG_ID}
    buckets:
      raw: omagotchi-raw
      avg-1h: omagotchi-avg-1h
      avg-1d: omagotchi-avg-1d

omagotchi:
  scheduling:
    # 끄면 만료된 점유가 정리되지 않는다. Test에서만 끈다
    enabled: ${SCHEDULING_ENABLED:true}
  occupancy:
    expiry:
      # 만료 정리 주기. 공실 알림 지연의 상한이기도 하다
      fixed-delay: ${OCCUPANCY_EXPIRY_FIXED_DELAY:60000}
      # 기동 직후에는 Flyway·연결 풀 준비와 겹치지 않게 미룬다
      initial-delay: ${OCCUPANCY_EXPIRY_INITIAL_DELAY:30000}
    membership-sweep:
      # 소속 종료 정리(MR-26)가 유실됐을 때의 복구 지연 상한 (ADR space-team/0013).
      # 만료 정리(1분)보다 길게 잡는다 — 이미 실패한 건만 다루는 예외 경로다.
      fixed-delay: ${OCCUPANCY_MEMBERSHIP_SWEEP_FIXED_DELAY:300000}
      initial-delay: ${OCCUPANCY_MEMBERSHIP_SWEEP_INITIAL_DELAY:60000}
      batch-size: ${OCCUPANCY_MEMBERSHIP_SWEEP_BATCH_SIZE:200}
  team:
    sweep:
      # 고아 팀원 정합성 스윕 주기 = 복구 지연의 상한 (ADR space-team/0013).
      # 이미 실패한 건만 다루는 예외 경로라 만료 정리보다 길게 잡는다
      fixed-delay: ${TEAM_SWEEP_FIXED_DELAY:300000}
      initial-delay: ${TEAM_SWEEP_INITIAL_DELAY:60000}
      # 한 배치에서 훑을 소속 행 수. team_members는 물리 삭제라 전체가 유계지만
      # 한 번에 전건을 들고 오지 않는다
      batch-size: ${TEAM_SWEEP_BATCH_SIZE:200}

kma:
  base-url: https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0
  service-key: ${KMA_SERVICE_KEY}
  request-timeout: 3s
