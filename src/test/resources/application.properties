# Test slices that do not activate the test profile still require the JWT binding
# declared by LearningServiceApplication. These values are test-only and load
# before any application Context can access an external resource.
auth.jwt.issuer=https://identity.omagotchi.local
auth.jwt.audience=omagotchi-api
auth.jwt.public-key-location=classpath:unused-test-key.pem
